# JJ-Sprint5 13/11/2026: análisis de SonarCloud desde GitHub Actions (.github/workflows/sonarcloud.yml).
# El análisis automático de SonarCloud no importa cobertura; este sí lee el lcov de Vitest.
sonar.projectKey=Johann-Yamil15_CampusBite-Front
sonar.organization=johann-yamil15

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/environments/**

# Mocks de demo: se retiran al conectar el back (BACKEND_SPECIFICATION §9)
sonar.coverage.exclusions=**/*.spec.ts,src/main.ts,src/environments/**,**/*.mock-data.ts,src/app/core/mock/**

# Lo genera: ng test --watch=false --coverage --coverage-reporters=lcov
sonar.javascript.lcov.reportPaths=coverage/campusbite-front/lcov.info
