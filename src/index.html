<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CampusBite</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CampusBite: pide comida en tu campus." />
    <meta name="theme-color" content="#ab3500" />
    <!-- CL-Sprint5 11/11/2026 (etapa 8): aplica el tema elegido en Perfil → Apariencia antes de pintar, para
         que no parpadee en claro al cargar. Lo mismo hace TemaService después. -->
    <script>
      try {
        var t = localStorage.getItem('cb.tema');
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t === 'oscuro' ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- JJ-Sprint3 21/10/2026: tipografía del sistema de diseño (Campus Quick-Bite) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activa JavaScript para usar CampusBite.</noscript>
  </body>
</html>
