<!-- JY-Sprint4 05/11/2026: con una sola página no se dibuja nada: el control sobraría. -->
@if (paginas() > 1) {
  <nav class="pag" aria-label="Paginación">
    <p class="pag-rango">
      Mostrando {{ desde() }}–{{ hasta() }} de {{ total() }} {{ etiqueta() }}
    </p>

    <div class="pag-controles">
      <button
        type="button"
        class="pag-btn"
        [disabled]="pagina() === 1"
        (click)="ir(pagina() - 1)"
      >
        <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
        <span class="sr-only">Página anterior</span>
      </button>

      @for (n of numeros(); track n) {
        <button
          type="button"
          class="pag-num"
          [class.active]="n === pagina()"
          [attr.aria-current]="n === pagina() ? 'page' : null"
          (click)="ir(n)"
        >
          <span class="sr-only">Página</span>
          {{ n }}
        </button>
      }

      <button
        type="button"
        class="pag-btn"
        [disabled]="pagina() === paginas()"
        (click)="ir(pagina() + 1)"
      >
        <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
        <span class="sr-only">Página siguiente</span>
      </button>
    </div>
  </nav>
}
