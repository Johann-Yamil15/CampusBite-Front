<!-- FB-Sprint4 29/10/2026: UI de la fila del carrito (imagen, nombre, precios y cantidad) -->
<article class="carrito-item">
  <div class="imagen-wrapper">
    @if (item().imagenUrl) {
      <img [src]="item().imagenUrl" [alt]="item().producto" loading="lazy" />
    } @else {
      <div class="placeholder-img"><mat-icon>restaurant</mat-icon></div>
    }
  </div>

  <div class="info-wrapper">
    <div class="fila-titulo">
      <h4 class="item-nombre" [title]="item().producto">{{ item().producto }}</h4>
      <button
        mat-icon-button
        class="btn-eliminar"
        type="button"
        matTooltip="Quitar del carrito"
        [attr.aria-label]="'Quitar ' + item().producto + ' del carrito'"
        (click)="eliminar()"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
    </div>

    <span class="item-unitario">{{ item().precio | currency: 'MXN' }} c/u</span>

    <div class="fila-acciones">
      <div class="stepper" role="group" [attr.aria-label]="'Cantidad de ' + item().producto">
        <button
          type="button"
          class="stepper-btn"
          [attr.aria-label]="esUltimo() ? 'Eliminar producto' : 'Quitar una unidad'"
          (click)="decrementar()"
        >
          <mat-icon>{{ esUltimo() ? 'delete_outline' : 'remove' }}</mat-icon>
        </button>
        <span class="stepper-valor" aria-live="polite">{{ item().cantidad }}</span>
        <button
          type="button"
          class="stepper-btn"
          aria-label="Agregar una unidad"
          [disabled]="enLimite()"
          (click)="incrementar()"
        >
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <span class="item-subtotal">{{ subtotal() | currency: 'MXN' }}</span>
    </div>

    @if (enLimite()) {
      <span class="aviso-limite">Máximo {{ max }} unidades por producto</span>
    }
  </div>
</article>
