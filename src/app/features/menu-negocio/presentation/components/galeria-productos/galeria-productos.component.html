<!-- CL-Sprint4 28/10/2026: HU-07B. Cuadrícula de platillos -->
@if (menuEmpty()) {
  <div class="empty">
    <img src="assets/images/producto-sin-imagen.svg" alt="" width="160" height="120" />
    <p><strong>Aún no tienes platillos en tu menú.</strong></p>
    <p class="muted">Agrega el primero para que los alumnos puedan pedirlo.</p>
    <button type="button" class="cb-btn cb-btn--primary" (click)="create.emit()">
      Agregar platillo
    </button>
  </div>
} @else if (!products().length) {
  <div class="empty">
    <p><strong>No hay platillos que coincidan.</strong></p>
    <button type="button" class="cb-btn cb-btn--secondary" (click)="clearFilter.emit()">
      Ver todos
    </button>
  </div>
} @else {
  <ul class="grid">
    @for (product of products(); track product.id) {
      <li>
        <app-producto-card
          [product]="product"
          [pending]="pending().has(product.id)"
          (edit)="edit.emit($event)"
          (changeImage)="changeImage.emit($event)"
          (remove)="remove.emit($event)"
          (availabilityChange)="availabilityChange.emit({ product, available: $event })"
        />
      </li>
    }
  </ul>
}
